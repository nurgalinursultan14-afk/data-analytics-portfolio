version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('stg_customers'), field: customer_id}}
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]
  - name: stg_order_items
    data_tests:
      - unique_combination_of_columns:
          arguments: {columns: [order_id, order_item_id]}
    columns:
      - name: order_id
        data_tests:
          - relationships: {arguments: {to: ref('stg_orders'), field: order_id}}
      - name: product_id
        data_tests:
          - relationships: {arguments: {to: ref('stg_products'), field: product_id}}
      - name: price
        data_tests: [not_null]
  - name: stg_reviews
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: review_score
        data_tests:
          - accepted_values: {arguments: {values: [1, 2, 3, 4, 5], quote: false}}
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
